name: Smoke Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pytest rapidfuzz

      - name: Compile Python sources
        run: |
          python -m compileall streamlit_app.py Source Myrepo tests

      - name: Run focused unit tests
        run: |
          pytest tests/test_name_matching.py -q